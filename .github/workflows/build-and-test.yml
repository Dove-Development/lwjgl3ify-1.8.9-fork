name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          # 17 compiles the mod (Jabel, --release 8), 21 runs Gradle/essential-loom and the game
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Build
        run: ./gradlew --stacktrace assemble remapSmoketestJar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl3ify-1.8.9
          path: |
            build/libs/*.jar
            build/libs/*.json
            build/distributions/*.zip
