name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The tag is the version: launcher-metadata/version.json downloads the forgePatches jar from this release.
      RELEASE_VERSION: ${{ github.ref_name }}
      PRERELEASE: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || endsWith(github.ref_name, '-pre') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 32

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Build
        run: ./gradlew --stacktrace -PmodVersion="${RELEASE_VERSION}" assemble

      - name: Delete old release if it already exists
        run: gh release delete --yes "${RELEASE_VERSION}"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release under current tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          CHANGELOG_FILE=".changelogs/${RELEASE_VERSION}.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            CHANGELOG_FILE="$(mktemp --suffix=.md)"
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_VERSION}" \
              --jq ".body" > "${CHANGELOG_FILE}"
          fi
          gh release create "${RELEASE_VERSION}" -F "${CHANGELOG_FILE}" ${PRERELEASE_FLAG} \
            ./build/libs/*.jar ./build/libs/*.json ./build/distributions/*.zip
